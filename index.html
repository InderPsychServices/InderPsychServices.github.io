<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inder Psychological Services | Forensic Immigration Evaluations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=DM+Sans:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
/* ─── TOKENS ──────────────────────────────────────────────────── */
:root {
  --ink:        #08111e;
  --ink-mid:    #0e1d30;
  --ink-lift:   #152540;
  --gold:       #c8a45a;
  --gold-hi:    #e2c07a;
  --gold-dim:   rgba(200,164,90,0.55);
  --gold-ghost: rgba(200,164,90,0.07);
  --cream:      #ede8de;
  --cream-dim:  #a89e8e;
  --mist:       #647384;
  --rule:       rgba(200,164,90,0.16);
  --white:      #ffffff;
  --r: 0.5rem;
}

/* ─── RESET ───────────────────────────────────────────────────── */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; font-size:16px; }

body {
  background: var(--ink);
  color: var(--cream);
  font-family: 'DM Sans', sans-serif;
  font-weight: 300;
  line-height: 1.72;
  overflow-x: hidden;
  cursor: none;
}

/* ─── CUSTOM CURSOR ───────────────────────────────────────────── */
.cursor-dot {
  position: fixed;
  width: 8px; height: 8px;
  background: var(--gold);
  border-radius: 50%;
  pointer-events: none;
  z-index: 99999;
  transform: translate(-50%,-50%);
  transition: transform 0.08s ease, opacity 0.2s;
  mix-blend-mode: difference;
}
.cursor-ring {
  position: fixed;
  width: 36px; height: 36px;
  border: 1px solid var(--gold-dim);
  border-radius: 50%;
  pointer-events: none;
  z-index: 99998;
  transform: translate(-50%,-50%);
  transition: transform 0.18s ease, width 0.3s, height 0.3s, border-color 0.3s;
}
body:hover .cursor-ring { opacity: 1; }

/* ─── GRAIN ───────────────────────────────────────────────────── */
body::before {
  content:'';
  position:fixed; inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  opacity:0.032; pointer-events:none; z-index:9998;
}

/* ─── SCROLLBAR ───────────────────────────────────────────────── */
::-webkit-scrollbar { width:3px; }
::-webkit-scrollbar-track { background:var(--ink); }
::-webkit-scrollbar-thumb { background:var(--gold-dim); }

/* ─── NAVIGATION ──────────────────────────────────────────────── */
nav {
  position:fixed; top:0; left:0; right:0;
  height:76px; z-index:1000;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 clamp(1.5rem,5vw,4.5rem);
  transition:background 0.5s ease, border-color 0.5s;
  border-bottom:1px solid transparent;
}
nav.scrolled {
  background:rgba(8,17,30,0.94);
  backdrop-filter:blur(22px);
  border-bottom-color:var(--rule);
}

.nav-brand {
  display:flex; flex-direction:column; gap:1px;
  text-decoration:none;
}
.nav-brand-main {
  font-family:'Cormorant Garamond',serif;
  font-size:1.05rem; font-weight:500;
  letter-spacing:0.16em; text-transform:uppercase;
  color:var(--cream);
}
.nav-brand-sub {
  font-size:0.55rem; font-weight:400;
  letter-spacing:0.28em; text-transform:uppercase;
  color:var(--gold);
}

.nav-right {
  display:flex; align-items:center; gap:2.8rem;
}

.nav-links {
  display:flex; list-style:none;
  gap:2.4rem; align-items:center;
}
.nav-links a {
  font-size:0.67rem; font-weight:400;
  letter-spacing:0.22em; text-transform:uppercase;
  color:var(--mist); text-decoration:none;
  transition:color 0.3s;
}
.nav-links a:hover { color:var(--cream); }

.nav-pill {
  font-size:0.65rem; font-weight:500;
  letter-spacing:0.2em; text-transform:uppercase;
  color:var(--gold); text-decoration:none;
  border:1px solid var(--gold-dim);
  padding:9px 24px;
  transition:all 0.35s ease;
  position:relative; overflow:hidden;
}
.nav-pill::before {
  content:'';
  position:absolute; inset:0;
  background:var(--gold);
  transform:translateX(-101%);
  transition:transform 0.35s ease;
}
.nav-pill span { position:relative; z-index:1; }
.nav-pill:hover::before { transform:translateX(0); }
.nav-pill:hover span { color:var(--ink); }

/* ─── MARQUEE ─────────────────────────────────────────────────── */
.marquee-strip {
  overflow:hidden;
  background:var(--gold);
  padding:10px 0;
  position:relative; z-index:10;
  margin-top:76px;
}
.marquee-track {
  display:flex; gap:0;
  animation:marquee 28s linear infinite;
  white-space:nowrap;
}
.marquee-track:hover { animation-play-state:paused; }
.marquee-item {
  flex-shrink:0;
  font-size:0.58rem; font-weight:500;
  letter-spacing:0.3em; text-transform:uppercase;
  color:var(--ink);
  padding:0 2.5rem;
}
.marquee-sep {
  flex-shrink:0;
  font-size:0.5rem; color:var(--ink);
  opacity:0.5; padding:0 0.5rem;
  align-self:center;
}
@keyframes marquee {
  from { transform:translateX(0); }
  to   { transform:translateX(-50%); }
}

/* ─── HERO ────────────────────────────────────────────────────── */
.hero {
  min-height:calc(100vh - 76px);
  display:grid;
  grid-template-columns:1fr 1fr;
  position:relative;
  overflow:hidden;
}

/* Diagonal split line */
.hero::before {
  content:'';
  position:absolute;
  top:0; left:50%;
  width:1px; height:100%;
  background:linear-gradient(to bottom,transparent,var(--rule) 20%,var(--rule) 80%,transparent);
  transform:rotate(0deg);
}

/* Ambient glow */
.hero-glow {
  position:absolute;
  width:600px; height:600px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(200,164,90,0.06) 0%,transparent 70%);
  top:-100px; left:-100px;
  pointer-events:none;
}

.hero-left {
  padding:clamp(3rem,8vw,7rem) clamp(2rem,5vw,5rem);
  display:flex; flex-direction:column; justify-content:center;
  position:relative;
}

.eyebrow-row {
  display:flex; align-items:center; gap:12px;
  margin-bottom:2.2rem;
  opacity:0; animation:fadeUp 0.9s 0.2s ease forwards;
}
.eyebrow-dash { width:28px; height:1px; background:var(--gold); }
.eyebrow-text {
  font-size:0.62rem; font-weight:400;
  letter-spacing:0.3em; text-transform:uppercase;
  color:var(--gold);
}

.hero-h1 {
  font-family:'Cormorant',serif;
  font-size:clamp(3.2rem,5.5vw,6.2rem);
  font-weight:300;
  line-height:1.06;
  color:var(--cream);
  margin-bottom:2.4rem;
  opacity:0; animation:fadeUp 0.9s 0.35s ease forwards;
}
.hero-h1 em {
  font-style:italic; color:var(--gold-hi);
  font-weight:300;
}

.hero-lead {
  font-size:0.88rem; font-weight:300;
  color:var(--mist); line-height:1.9;
  max-width:420px; margin-bottom:3rem;
  opacity:0; animation:fadeUp 0.9s 0.5s ease forwards;
}

.hero-actions {
  display:flex; gap:1.4rem; align-items:center;
  flex-wrap:wrap;
  opacity:0; animation:fadeUp 0.9s 0.65s ease forwards;
}

.btn-solid {
  display:inline-block;
  background:var(--gold);
  color:var(--ink);
  font-size:0.65rem; font-weight:500;
  letter-spacing:0.24em; text-transform:uppercase;
  text-decoration:none;
  padding:16px 40px;
  transition:all 0.35s ease;
  position:relative; overflow:hidden;
}
.btn-solid::after {
  content:'';
  position:absolute; inset:0;
  background:var(--gold-hi);
  transform:translateX(-101%);
  transition:transform 0.35s ease;
}
.btn-solid span { position:relative; z-index:1; }
.btn-solid:hover::after { transform:translateX(0); }
.btn-solid:hover { transform:translateY(-2px); box-shadow:0 16px 48px rgba(200,164,90,0.25); }

.btn-line {
  display:inline-flex; align-items:center; gap:10px;
  color:var(--mist);
  font-size:0.65rem; font-weight:400;
  letter-spacing:0.2em; text-transform:uppercase;
  text-decoration:none;
  transition:color 0.3s;
}
.btn-line:hover { color:var(--gold); }
.btn-line-arrow { transition:transform 0.3s; }
.btn-line:hover .btn-line-arrow { transform:translateX(5px); }

/* Hero right — stat stack */
.hero-right {
  display:flex; flex-direction:column; justify-content:center;
  padding:clamp(3rem,8vw,7rem) clamp(2rem,5vw,5rem);
  gap:0;
  opacity:0; animation:fadeUp 0.9s 0.45s ease forwards;
}

.hero-stat {
  display:grid;
  grid-template-columns:1fr auto;
  align-items:center;
  padding:2rem 0;
  border-bottom:1px solid var(--rule);
  gap:1rem;
  transition:background 0.3s;
  cursor:default;
}
.hero-stat:first-child { border-top:1px solid var(--rule); }
.hero-stat:hover { padding-left:10px; }

.hero-stat-body {}
.hero-stat-n {
  font-family:'Cormorant',serif;
  font-size:3rem; font-weight:300;
  color:var(--gold); line-height:1;
  margin-bottom:0.3rem;
  transition:color 0.3s;
}
.hero-stat:hover .hero-stat-n { color:var(--gold-hi); }
.hero-stat-desc {
  font-size:0.78rem; font-weight:300;
  color:var(--mist); line-height:1.5;
  max-width:260px;
}

.hero-stat-icon {
  opacity:0.18;
  transition:opacity 0.3s;
}
.hero-stat:hover .hero-stat-icon { opacity:0.45; }

/* Lang pills row */
.lang-pills {
  display:flex; gap:0.6rem; flex-wrap:wrap;
  padding:1.6rem 0 0;
}
.lpill {
  font-size:0.6rem; font-weight:500;
  letter-spacing:0.14em; text-transform:uppercase;
  color:var(--gold);
  border:1px solid var(--rule);
  padding:5px 14px;
  background:var(--gold-ghost);
  transition:border-color 0.3s, background 0.3s;
}
.lpill:hover { border-color:var(--gold-dim); background:rgba(200,164,90,0.12); }

/* ─── SECTION HELPERS ─────────────────────────────────────────── */
.sec {
  padding:clamp(4rem,9vw,8.5rem) clamp(1.5rem,5vw,4.5rem);
}
.sec-alt { background:var(--ink-mid); }
.sec-lift { background:var(--ink-lift); }

.sec-head { max-width:760px; }
.sec-tag {
  display:inline-flex; align-items:center; gap:10px;
  margin-bottom:1.4rem;
}
.sec-tag-line { width:24px; height:1px; background:var(--gold); }
.sec-tag-label {
  font-size:0.6rem; font-weight:500;
  letter-spacing:0.3em; text-transform:uppercase;
  color:var(--gold);
}
.sec-h {
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(2.2rem,3.8vw,4rem);
  font-weight:300; line-height:1.15;
  color:var(--cream); margin-bottom:1.2rem;
}
.sec-h em { font-style:italic; color:var(--gold-hi); }
.sec-p {
  font-size:0.86rem; font-weight:300;
  color:var(--mist); line-height:1.9;
  max-width:520px; margin-bottom:3.5rem;
}

/* ─── SERVICES ────────────────────────────────────────────────── */
.services-grid {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  border-top:1px solid var(--rule);
  border-left:1px solid var(--rule);
}

.svc {
  border-bottom:1px solid var(--rule);
  border-right:1px solid var(--rule);
  padding:2.8rem 2.4rem;
  position:relative; overflow:hidden;
  transition:background 0.4s;
  cursor:default;
}
.svc::after {
  content:'';
  position:absolute; bottom:0; left:0; right:0;
  height:2px; background:var(--gold);
  transform:scaleX(0); transform-origin:left;
  transition:transform 0.5s ease;
}
.svc:hover { background:rgba(200,164,90,0.04); }
.svc:hover::after { transform:scaleX(1); }

.svc-index {
  font-family:'Cormorant',serif;
  font-size:4rem; font-weight:200;
  color:rgba(200,164,90,0.09);
  line-height:1; margin-bottom:1.5rem;
  transition:color 0.4s;
}
.svc:hover .svc-index { color:rgba(200,164,90,0.18); }

.svc-name {
  font-family:'Cormorant Garamond',serif;
  font-size:1.3rem; font-weight:500;
  color:var(--cream); margin-bottom:0.8rem;
  line-height:1.25;
}

.svc-desc {
  font-size:0.8rem; font-weight:300;
  color:var(--mist); line-height:1.85;
}

.svc-badge {
  display:inline-block; margin-top:1.4rem;
  font-size:0.58rem; font-weight:500;
  letter-spacing:0.18em; text-transform:uppercase;
  color:var(--gold-dim);
  border:1px solid var(--rule);
  padding:4px 12px;
  transition:border-color 0.3s, color 0.3s;
}
.svc:hover .svc-badge { border-color:var(--gold-dim); color:var(--gold); }

/* ─── ABOUT ───────────────────────────────────────────────────── */
.about-wrap {
  display:grid;
  grid-template-columns:5fr 6fr;
  gap:clamp(3rem,6vw,7rem);
  align-items:start;
}

.about-visual { position:relative; }

.about-card {
  background:var(--ink-lift);
  border:1px solid var(--rule);
  aspect-ratio:3/4;
  display:flex; flex-direction:column;
  justify-content:flex-end;
  overflow:hidden; position:relative;
}

.about-card-bg {
  position:absolute; inset:0;
  background:
    linear-gradient(to bottom right,rgba(200,164,90,0.04) 0%,transparent 50%),
    repeating-linear-gradient(
      45deg,
      transparent,
      transparent 40px,
      rgba(200,164,90,0.018) 40px,
      rgba(200,164,90,0.018) 41px
    );
}

.about-monogram {
  position:absolute; top:50%; left:50%;
  transform:translate(-50%,-50%);
  font-family:'Cormorant',serif;
  font-size:12rem; font-weight:200;
  color:rgba(200,164,90,0.07);
  line-height:1; user-select:none;
  white-space:nowrap;
}

.about-card-foot {
  position:relative;
  background:var(--gold);
  padding:1.5rem 2rem;
  display:flex; align-items:center; justify-content:space-between;
}
.about-card-foot-name {
  font-family:'Cormorant Garamond',serif;
  font-size:1.15rem; font-weight:500;
  color:var(--ink); letter-spacing:0.04em;
}
.about-card-foot-cred {
  font-size:0.62rem; font-weight:500;
  letter-spacing:0.18em; text-transform:uppercase;
  color:rgba(8,17,30,0.6);
  margin-top:2px;
}
.about-card-foot-states {
  font-size:0.6rem; font-weight:500;
  letter-spacing:0.14em;
  color:rgba(8,17,30,0.7);
  text-align:right;
}

.about-ornament {
  position:absolute; top:-18px; right:-18px;
  width:72px; height:72px;
  border-top:1.5px solid var(--gold);
  border-right:1.5px solid var(--gold);
  opacity:0.5;
}
.about-ornament-bl {
  top:auto; right:auto;
  bottom:-18px; left:-18px;
  border-top:none; border-right:none;
  border-bottom:1.5px solid var(--gold);
  border-left:1.5px solid var(--gold);
}

.about-body {}
.about-body .sec-p { max-width:100%; margin-bottom:1.5rem; }

.about-body p {
  font-size:0.87rem; font-weight:300;
  color:var(--mist); line-height:1.95;
  margin-bottom:1.4rem;
}

.about-creds {
  display:grid; grid-template-columns:1fr 1fr;
  gap:1px; margin:2.2rem 0;
  border:1px solid var(--rule);
  background:var(--rule);
}
.cred {
  background:var(--ink-mid);
  padding:1.2rem 1.4rem;
  transition:background 0.3s;
}
.cred:hover { background:var(--ink-lift); }
.cred-l {
  font-size:0.58rem; font-weight:500;
  letter-spacing:0.22em; text-transform:uppercase;
  color:var(--gold); margin-bottom:4px;
}
.cred-v {
  font-family:'Cormorant Garamond',serif;
  font-size:1.02rem; font-weight:500;
  color:var(--cream);
}

/* ─── PROCESS ─────────────────────────────────────────────────── */
.process-wrap {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:clamp(3rem,6vw,7rem);
}

.process-steps { display:flex; flex-direction:column; }

.pstep {
  display:flex; gap:2rem;
  padding-bottom:2.8rem;
  position:relative;
  cursor:default;
}
.pstep:last-child { padding-bottom:0; }

.pstep-left { display:flex; flex-direction:column; align-items:center; }

.pstep-dot {
  width:42px; height:42px; flex-shrink:0;
  border:1px solid var(--rule);
  background:var(--ink-mid);
  display:flex; align-items:center; justify-content:center;
  font-family:'Cormorant',serif;
  font-size:1rem; font-weight:400;
  color:var(--gold);
  transition:all 0.35s;
  position:relative; z-index:1;
}
.pstep:hover .pstep-dot {
  background:var(--gold);
  color:var(--ink);
  border-color:var(--gold);
}

.pstep-spine {
  flex:1; width:1px;
  background:var(--rule);
  margin:6px 0;
}
.pstep:last-child .pstep-spine { display:none; }

.pstep-body { padding-top:8px; }
.pstep-title {
  font-family:'Cormorant Garamond',serif;
  font-size:1.2rem; font-weight:500;
  color:var(--cream); margin-bottom:0.5rem;
  transition:color 0.3s;
}
.pstep:hover .pstep-title { color:var(--gold-hi); }
.pstep-desc {
  font-size:0.81rem; font-weight:300;
  color:var(--mist); line-height:1.9;
}

/* Sticky panel */
.process-panel {
  position:sticky; top:96px;
  border:1px solid var(--rule);
  background:var(--ink-lift);
  align-self:start;
  overflow:hidden;
}

.panel-head {
  padding:2rem 2.4rem;
  border-bottom:1px solid var(--rule);
  background:var(--gold);
}
.panel-head-title {
  font-family:'Cormorant Garamond',serif;
  font-size:1.3rem; font-weight:500;
  color:var(--ink);
}
.panel-head-sub {
  font-size:0.68rem; font-weight:400;
  letter-spacing:0.12em; text-transform:uppercase;
  color:rgba(8,17,30,0.55);
  margin-top:3px;
}

.panel-body { padding:0 2.4rem; }

.prow {
  display:grid; grid-template-columns:auto 1fr;
  gap:1rem; align-items:start;
  padding:1.4rem 0;
  border-bottom:1px solid rgba(200,164,90,0.08);
}
.prow:last-child { border-bottom:none; }

.prow-dot {
  width:6px; height:6px; border-radius:50%;
  background:var(--gold); opacity:0.65;
  margin-top:7px;
}
.prow-label {
  font-size:0.62rem; font-weight:500;
  letter-spacing:0.18em; text-transform:uppercase;
  color:var(--gold); margin-bottom:3px;
}
.prow-val {
  font-size:0.83rem; font-weight:300;
  color:var(--cream-dim);
}

/* ─── LANGUAGES ───────────────────────────────────────────────── */
.lang-sec {
  text-align:center;
  position:relative; overflow:hidden;
}
.lang-sec::before {
  content:'';
  position:absolute; inset:0;
  background:
    radial-gradient(ellipse 80% 60% at 50% 50%,rgba(200,164,90,0.05) 0%,transparent 70%);
  pointer-events:none;
}

.lang-center { position:relative; }

.lang-display {
  display:flex; justify-content:center; align-items:stretch;
  flex-wrap:wrap;
  margin:3.5rem 0;
  border:1px solid var(--rule);
  background:var(--ink-mid);
}

.lang-item {
  flex:1; min-width:180px;
  padding:2.8rem 2rem;
  border-right:1px solid var(--rule);
  display:flex; flex-direction:column;
  align-items:center; gap:0.8rem;
  transition:background 0.35s;
  cursor:default;
}
.lang-item:last-child { border-right:none; }
.lang-item:hover { background:rgba(200,164,90,0.04); }

.lang-script {
  font-family:'Cormorant',serif;
  font-size:2rem; font-weight:300;
  color:var(--cream); line-height:1.2;
}
.lang-name {
  font-size:0.62rem; font-weight:500;
  letter-spacing:0.24em; text-transform:uppercase;
  color:var(--gold);
}
.lang-note {
  font-size:0.68rem; font-weight:300;
  color:var(--mist);
}

.lang-direct-note {
  display:inline-flex; align-items:center; gap:10px;
  background:var(--gold-ghost);
  border:1px solid var(--rule);
  padding:12px 24px;
}
.lang-direct-note-text {
  font-size:0.75rem; font-weight:300;
  color:var(--cream-dim);
}
.lang-direct-note-text strong { color:var(--gold); font-weight:400; }

/* ─── FAQ ─────────────────────────────────────────────────────── */
.faq-wrap {
  display:grid;
  grid-template-columns:1fr 2fr;
  gap:clamp(3rem,6vw,7rem);
